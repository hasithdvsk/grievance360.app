version: '3.8'

services:
  # Database Service: PostgreSQL with PostGIS Geospatial extensions
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: grievance360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secret_password
      POSTGRES_DB: grievance360_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./packages/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grievance360_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - grievance360-network

  # Cache & Queue Broker: Redis
  redis:
    image: redis:7-alpine
    container_name: grievance360-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - grievance360-network

  # Backend API: FastAPI with AI embedding & redressing engine
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: grievance360-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_secret_password@postgres:5432/grievance360_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - API_PORT=8000
      - API_HOST=0.0.0.0
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - grievance360-network

  # Frontend Web Client: Next.js 14 App Router
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: grievance360-web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - grievance360-network

networks:
  grievance360-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
